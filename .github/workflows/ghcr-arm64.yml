name: GHCR arm64

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: MetaCubeX/mihomo tag
        required: true
        default: v1.19.33
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: ${{ inputs.upstream || github.ref_name }}
          path: src

      - name: Apply UDP 0-RTT
        run: sh scripts/apply.sh

      - name: Download geo databases
        run: |
          set -eu
          mkdir -p src/docker/geo
          base=https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest
          for name in geoip.metadb geosite.dat geoip.dat; do
            curl -fL --retry 10 --retry-all-errors --retry-delay 3 \
              -o "src/docker/geo/$name" "$base/$name"
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag
        id: tag
        run: echo "version=${{ inputs.upstream || github.ref_name }}-udp0rtt" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/seemsfishy/mihomo-udp0rtt:${{ steps.tag.outputs.version }}
            ghcr.io/seemsfishy/mihomo-udp0rtt:latest
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/SeemsFishy/mihomo-udp0rtt
